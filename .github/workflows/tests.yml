# Runs the overlay's tests on every push and pull request, on Windows, with the exact packages the
# download is built with. Pull requests from other people's copies get a read-only token and no
# secrets (GitHub's rule for pull_request), so their code can't change anything here.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Logic tests (tracking, mesos, the repot bell's sums, local only)
        run: python tests/test_logic.py
      - name: Screen-reading tests
        run: python tests/test_screen.py
      - name: Potion popup tests (the controller's left trigger)
        run: python tests/test_pots.py
      - name: Pickup tests (reading pickup lines)
        run: python tests/test_pickups.py
      - name: Message watcher tests (the message stack, read by the game's font)
        run: python tests/test_msgwatch.py
      - name: Item line tests (the items picked up, read by the game's font and named from its item list)
        run: python tests/test_items.py
      - name: Bug report tests
        run: python tests/test_report.py
      - name: Text-reading tests (Tesseract, when installed)
        run: python tests/test_ocr.py
      - name: Window tests (the main window, Settings, the tracker card)
        run: python tests/test_ui.py
